[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-challenge-assistant-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastembed==0.8.0", "mcp>=1.28,<2", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2"]
[tool.setuptools.packages.find]
where = ["src"]
