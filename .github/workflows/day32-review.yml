name: Day32 AI review
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Номер PR из этого репозитория
        required: true
        type: number
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: day32-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      # Inline trusted bootstrap, before any checkout. Event strings never enter shell code.
      - name: Resolve trusted base
        id: pr
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const number = context.payload.pull_request?.number ?? Number(context.payload.inputs?.pr_number);
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid PR number');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            const sameRepo = pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            core.setOutput('allowed', sameRepo ? 'true' : 'false');
            core.setOutput('base', pr.base.sha);
            if (!sameRepo) await core.summary.addRaw('Fork PR пропущен: Day32 обслуживает PR внутри репозитория.').write();
      - name: Checkout trusted base only
        if: steps.pr.outputs.allowed == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.pr.outputs.base }}
          persist-credentials: false
      - name: Python
        if: steps.pr.outputs.allowed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install trusted reviewer
        if: steps.pr.outputs.allowed == 'true'
        run: |
          python -m pip install -r packages/assistant_core/requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation ./packages/assistant_core ./day-32
      - name: Collect immutable base and head text
        if: steps.pr.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m day32_review collect --work day-32/data/review
      - name: Prepare local embeddings
        if: steps.pr.outputs.allowed == 'true'
        env:
          ASSISTANT_EMBED_CACHE: ${{ runner.temp }}/day32-embeddings
        run: |
          python -c 'import os; from fastembed import TextEmbedding; from assistant_core.rag import MODEL; TextEmbedding(model_name=MODEL, cache_dir=os.environ["ASSISTANT_EMBED_CACHE"], threads=2)'
      - name: Generate review
        if: steps.pr.outputs.allowed == 'true'
        env:
          TRUSTED_BASE_SHA: ${{ steps.pr.outputs.base }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ASSISTANT_EMBED_CACHE: ${{ runner.temp }}/day32-embeddings
        run: python -m day32_review generate --root . --work day-32/data/review
      - name: Publish current SHA review
        if: steps.pr.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m day32_review publish --work day-32/data/review
      - name: Review artifacts
        if: always() && steps.pr.outputs.allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day32-review-${{ github.run_id }}
          path: |
            day-32/data/review/report.json
            day-32/data/review/report.md
            day-32/data/review/error.json
          if-no-files-found: warn
          retention-days: 7
